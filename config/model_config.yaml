local_llm:
  provider: vllm
  model_name: Qwen/Qwen2.5-3B-Instruct
  base_url: http://127.0.0.1:8000/v1
  temperature: 0
  context_window: 8192
  max_output_tokens: 1024
  max_input_tokens: 6000
  max_input_chars: 22000
  quantization: bf16
  candidates:
    - Qwen/Qwen2.5-3B-Instruct
    - vinai/PhoGPT-4B-Chat
ner:
  optional_models:
    - urchade/gliner_multi-v2.1
    - vinai/phobert-base
cloud_llm:
  enabled_by_default: false
  note: "Chỉ bật qua .env sau khi đã review rủi ro dữ liệu nhạy cảm."
